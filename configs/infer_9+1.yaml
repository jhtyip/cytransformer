# Generate candidate triangulations from a trained checkpoint.
# Encoding (n_vertices, vocab, sequence lengths) is read from the checkpoint.
checkpoint_path: "Checkpoints/9+1/smoke/chkpt-4"
# Inference expects polytopes in the PROCESSED [POLYID, DRESVERTS] format
# (as produced by `cyt.prepare_data`), not the raw Kreuzer-Skarke dict format.
polys_file: "Data/9+1/smoke/test_polys.json"
num_of_polys: 5
num_of_triangs_per_poly: 4
unique_polytope_sampling: true
permutation: true
permutation_for_each_triang: false
gpu: false
save_results_file: "Saved_outputs/9+1/smoke_infer/results"
validate: false   # true -> verify candidates are FRSTs on the go (needs scipy + pycddlib)
